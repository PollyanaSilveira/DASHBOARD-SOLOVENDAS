name: Sincronizar leads do CV CRM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar sincronização
        env:
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: node scripts/sync-cvcrm.mjs
      - name: Comitar dados atualizados
        run: |
          git config user.name "cvcrm-sync-bot"
          git config user.email "actions@github.com"
          git add data/cvcrm-live.json
          git diff --cached --quiet && echo "Sem mudanças." || git commit -m "chore: atualiza dados do CV CRM [skip ci]"
          git push
