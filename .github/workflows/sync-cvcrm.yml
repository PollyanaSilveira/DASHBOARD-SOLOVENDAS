name: Sincronizar leads do CV CRM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar sincronização
        env:
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
          CVCRM_BIN_ID: ${{ secrets.CVCRM_BIN_ID }}
        run: node scripts/sync-cvcrm.mjs
